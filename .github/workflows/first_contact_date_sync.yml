name: First Contact Date Sync

on:
  schedule:
    - cron: "0 14 * * 5"  # Viernes 9am Colombia (UTC-5 → 14:00 UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Ejecutar First Contact Date Sync
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
        run: python first_contact_date_sync.py
