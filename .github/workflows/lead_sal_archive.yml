name: Lead SAL Archive

on:
  schedule:
    - cron: "0 17 * * 1-5"  # Lun-Vie 12pm Colombia (UTC-5 -> 17:00 UTC)
    - cron: "0 0 * * 2-6"   # Lun-Vie 7pm Colombia (UTC-5 -> 00:00 UTC martes-sab)
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TEST_MODE: true = solo lectura, false = ejecuta cambios"
        required: false
        default: "true"
      backfill_mode:
        description: "BACKFILL_MODE: true = procesa TODOS los deals open con SAL date lleno (no solo hoy)"
        required: false
        default: "false"
      sal_lookback_days:
        description: "SAL_LOOKBACK_DAYS: cuántos días hacia atrás buscar SAL dates retroactivos (default 2 = hoy+ayer)"
        required: false
        default: "2"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Ejecutar Lead SAL Archive
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
          BACKFILL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_mode || 'false' }}
          SAL_LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.sal_lookback_days || '2' }}
        run: python lead_sal_archive.py

      - name: Subir backup como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-sal-backup-${{ github.run_id }}
          path: lead_sal_archive_backup.json
          if-no-files-found: ignore
