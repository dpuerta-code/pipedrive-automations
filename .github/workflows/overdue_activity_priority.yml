name: Overdue Activity Priority

on:
  schedule:
    - cron: "0 12 * * *"   # Todos los dias 7am Colombia (UTC-5 -> 12:00 UTC)
  workflow_dispatch:
    inputs:
      test_mode:
        description: "true = solo probar con 5 leads, false = correr todo"
        required: true
        default: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Ejecutar Overdue Activity Priority
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python overdue_activity_priority.py

      - name: Guardar log de cambios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overdue-activity-priority-result-log
          path: overdue_activity_priority_result_log.json
          if-no-files-found: ignore
