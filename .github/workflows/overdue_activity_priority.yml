name: Overdue Activity Priority

on:
  schedule:
    - cron: "19 9 * * *"   # Todos los dias ~4am Colombia (UTC-5 -> 09:19 UTC). Antes era 7am en punto (12:00 UTC), pero GitHub Actions lo retrasaba 3-5 horas (hora de mayor congestion); se adelanta y se usa un minuto fuera de punta.
  workflow_dispatch:
    inputs:
      test_mode:
        description: "true = solo probar con 5 leads, false = correr todo"
        required: true
        default: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Ejecutar Overdue Activity Priority
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python overdue_activity_priority.py

      - name: Guardar log de cambios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overdue-activity-priority-result-log
          path: overdue_activity_priority_result_log.json
          if-no-files-found: ignore
