name: OG Mirror Sync

on:
  schedule:
    - cron: "0 0 * * 2-6"  # Lunes–viernes 7pm Colombia (UTC-5 → 00:00 UTC del día siguiente)
  workflow_dispatch:        # permite correrlo manualmente desde GitHub

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Ejecutar OG Mirror Sync
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          TEST_MODE: "false"
        run: python og_mirror_sync.py
