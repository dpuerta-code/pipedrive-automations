name: Org Contacted Audit

on:
  workflow_dispatch:
    inputs:
      scope_days:
        description: "SCOPE_DAYS: solo orgs con Prospection Date en los últimos N días (default 30)"
        required: false
        default: "30"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Ejecutar auditoría de First Contact Date
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          SCOPE_DAYS: ${{ github.event.inputs.scope_days || '30' }}
        run: python org_contacted_audit.py
