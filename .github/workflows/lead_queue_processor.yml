name: Lead Queue Processor

on:
  schedule:
    # Cada 15 min, lunes a viernes, 8am-5pm hora Colombia (UTC-5, sin DST)
    # => 13:00-22:00 UTC.
    - cron: "*/15 13-22 * * 1-5"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TEST_MODE: true = solo lectura, false = ejecuta cambios"
        required: false
        default: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Ejecutar Lead Queue Processor
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
        run: python lead_queue_processor.py
