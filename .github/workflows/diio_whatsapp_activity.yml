name: Diio WhatsApp Activity Sync

on:
  schedule:
    - cron: "11 17 * * *"   # ~12pm Colombia (UTC-5 -> 17:11 UTC). Minuto fuera de punta para evitar la congestion de GitHub Actions en :00.
    - cron: "23 20 * * *"   # ~3pm Colombia (UTC-5 -> 20:23 UTC)
    - cron: "37 0 * * *"    # ~7pm Colombia (UTC-5 -> 00:37 UTC)
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TEST_MODE: true = solo lectura, false = ejecuta cambios"
        required: false
        default: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Ejecutar Diio WhatsApp Activity Sync
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
        run: python diio_whatsapp_activity.py
