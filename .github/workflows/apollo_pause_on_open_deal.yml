name: Apollo Pause on Open Deal

on:
  schedule:
    - cron: "30 10 * * 1-5"  # Lunes-Viernes 5:30am Colombia (UTC-5 → 10:30 UTC)
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TEST_MODE: true = solo lectura, false = pausa contactos"
        required: false
        default: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Pausar contactos con org con deals abiertos
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
        run: python apollo_pause_on_open_deal.py

      - name: Subir log como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apollo-pause-on-open-deal-log-${{ github.run_id }}
          path: apollo_pause_on_open_deal_log.json
          if-no-files-found: ignore
