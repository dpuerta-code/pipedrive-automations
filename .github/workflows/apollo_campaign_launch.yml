name: Apollo Campaign Launch

on:
  schedule:
    - cron: "12 10 * * 1-5"  # Lunes-Viernes 5am Colombia (UTC-5 -> 10:12 UTC). Minuto
      # corrido de :00 -> :12 porque GitHub retrasa/pierde crons justo en la hora exacta
      # (hora de mas congestion en todos los runners de GitHub Actions, documentado por
      # GitHub); el resto de los ~20 workflows de este repo tambien usan minuto :00 y
      # varios mostraron retrasos de varias horas en su historial de corridas.
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TEST_MODE: true = solo lectura, false = ejecuta cambios"
        required: false
        default: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Ejecutar Apollo Campaign Launch
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
        run: python apollo_campaign_launch.py

      - name: Subir backup como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apollo-campaign-launch-backup-${{ github.run_id }}
          path: apollo_campaign_launch_backup.json
          if-no-files-found: ignore
