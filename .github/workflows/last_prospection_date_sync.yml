name: Last Prospection Date Sync

on:
  schedule:
    - cron: "0 15 * * 1-5"   # Lunes-viernes 10:00am Colombia (UTC-5 -> 15:00 UTC)
    - cron: "30 16 * * 1-5"  # Lunes-viernes 11:30am Colombia (UTC-5 -> 16:30 UTC)
    - cron: "30 18 * * 1-5"  # Lunes-viernes 1:30pm Colombia (UTC-5 -> 18:30 UTC)
    - cron: "0 20 * * 1-5"   # Lunes-viernes 3:00pm Colombia (UTC-5 -> 20:00 UTC)
    - cron: "0 23 * * 1-5"   # Lunes-viernes 6:00pm Colombia (UTC-5 -> 23:00 UTC)
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TEST_MODE: true = solo lectura, false = ejecuta cambios"
        required: false
        default: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Ejecutar Last Prospection Date Sync
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
        run: python last_prospection_date_sync.py
