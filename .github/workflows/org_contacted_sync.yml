name: Org Contacted Sync

on:
  schedule:
    - cron: "15 15 * * 1-5"  # Lunes-viernes 10:15am Colombia (UTC-5 -> 15:15 UTC)
    - cron: "45 16 * * 1-5"  # Lunes-viernes 11:45am Colombia (UTC-5 -> 16:45 UTC)
    - cron: "45 18 * * 1-5"  # Lunes-viernes 1:45pm Colombia (UTC-5 -> 18:45 UTC)
    - cron: "15 20 * * 1-5"  # Lunes-viernes 3:15pm Colombia (UTC-5 -> 20:15 UTC)
    - cron: "15 23 * * 1-5"  # Lunes-viernes 6:15pm Colombia (UTC-5 -> 23:15 UTC)
    - cron: "0 1 * * 2-6"    # Lunes-viernes 8:00pm Colombia (UTC-5 -> 01:00 UTC +1d) — backfill diario
  workflow_dispatch:
    inputs:
      backfill_mode:
        description: "BACKFILL_MODE: busca en historial completo de cada org pendiente (no solo 3 dias)"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Ejecutar Org Contacted Sync
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          CLICKHOUSE_HOST:     ${{ secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_PORT:     ${{ secrets.CLICKHOUSE_PORT }}
          CLICKHOUSE_USER:     ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          TEST_MODE: "false"
          BACKFILL_MODE: >-
            ${{
              (github.event_name == 'workflow_dispatch' && inputs.backfill_mode == 'true') ||
              (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 2-6')
            }}
        run: python org_contacted_sync.py
