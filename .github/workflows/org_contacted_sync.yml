name: Org Contacted Sync

on:
  schedule:
    - cron: "0 15 * * 1-5"   # Lunes-viernes 10:00am Colombia (UTC-5 -> 15:00 UTC)
    - cron: "30 16 * * 1-5"  # Lunes-viernes 11:30am Colombia (UTC-5 -> 16:30 UTC)
    - cron: "30 18 * * 1-5"  # Lunes-viernes 1:30pm Colombia (UTC-5 -> 18:30 UTC)
    - cron: "0 20 * * 1-5"   # Lunes-viernes 3:00pm Colombia (UTC-5 -> 20:00 UTC)
    - cron: "0 23 * * 1-5"   # Lunes-viernes 6:00pm Colombia (UTC-5 -> 23:00 UTC)
    - cron: "0 13 * * 1"     # Lunes 8:00am Colombia (UTC-5 -> 13:00 UTC) — backfill semanal
  workflow_dispatch:
    inputs:
      backfill_mode:
        description: "BACKFILL_MODE: busca en historial completo de cada org pendiente (no solo 3 dias)"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Ejecutar Org Contacted Sync
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          CLICKHOUSE_HOST:     ${{ secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_PORT:     ${{ secrets.CLICKHOUSE_PORT }}
          CLICKHOUSE_USER:     ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          TEST_MODE: "false"
          BACKFILL_MODE: >-
            ${{
              (github.event_name == 'workflow_dispatch' && inputs.backfill_mode == 'true') ||
              (github.event_name == 'schedule' && github.event.schedule == '0 13 * * 1')
            }}
        run: python org_contacted_sync.py
