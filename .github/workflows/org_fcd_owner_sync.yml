name: Org FCD Owner Sync

on:
  schedule:
    - cron: "0 13 * * 3"   # Miércoles 8:00am Colombia (UTC-5 → 13:00 UTC)
    - cron: "0 0 * * 6"    # Viernes 7:00pm Colombia (UTC-5 → 00:00 UTC sábado)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Ejecutar Org FCD Owner Sync
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          CLICKHOUSE_HOST:     ${{ secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_PORT:     ${{ secrets.CLICKHOUSE_PORT }}
          CLICKHOUSE_USER:     ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          TEST_MODE: "false"
        run: python org_fcd_owner_sync.py
